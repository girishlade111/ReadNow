<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadNow Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon48.png" alt="ReadNow" class="brand-logo" />
        <span class="brand-name">ReadNow</span>
        <span class="brand-badge">PRO</span>
      </div>
      <div class="header-actions">
        <span id="connection-status" class="status-pill status-offline" title="Checking server connection...">
          <span class="status-dot"></span> <span id="status-text">Connecting</span>
        </span>
        <button id="btn-open-options" class="icon-btn" title="Extension Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        Save Page
      </button>
      <button class="nav-tab" data-tab="tab-ai">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
        AI Copilot
      </button>
      <button class="nav-tab" data-tab="tab-recent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Saved ( <span id="article-count">0</span> )
      </button>
    </nav>

    <!-- Tab Contents -->
    <main class="tab-content-container">
      <!-- TAB 1: QUICK SAVE -->
      <section id="tab-save" class="tab-pane active">
        <div class="active-tab-card">
          <div class="page-meta">
            <h3 id="page-title" class="page-title">Loading Active Tab...</h3>
            <p id="page-url" class="page-url">https://...</p>
          </div>
        </div>

        <div class="form-group">
          <label for="collection-select">Target Collection</label>
          <select id="collection-select" class="form-control">
            <option value="">General Reading Queue</option>
          </select>
        </div>

        <div class="form-group">
          <label for="custom-tags">Tags (comma separated)</label>
          <input type="text" id="custom-tags" class="form-control" placeholder="e.g. AI, Research, Tech">
        </div>

        <div class="action-buttons">
          <button id="btn-save-page" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            Save Article to ReadNow
          </button>
          <button id="btn-quick-summarize" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
            Instant AI Summary
          </button>
        </div>

        <div id="save-status-msg" class="status-box hidden"></div>
      </section>

      <!-- TAB 2: AI COPILOT -->
      <section id="tab-ai" class="tab-pane">
        <div class="ai-prompt-box">
          <textarea id="ai-question-input" class="form-control text-area" rows="3" placeholder="Ask AI about this webpage or your saved library..."></textarea>
          
          <div class="chip-container">
            <button class="prompt-chip" data-prompt="Summarize the key points of this webpage in 3 bullet points.">⚡ 3-Bullet Summary</button>
            <button class="prompt-chip" data-prompt="What are the main actionable insights from this article?">💡 Actionable Insights</button>
            <button class="prompt-chip" data-prompt="Explain the technical concepts mentioned in this page clearly.">🎓 Explain Concepts</button>
          </div>

          <button id="btn-send-ai" class="btn btn-primary btn-block">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
            Ask Gemini Copilot
          </button>
        </div>

        <div id="ai-answer-container" class="ai-response-card hidden">
          <div class="ai-card-header">
            <span>AI Response</span>
            <button id="btn-copy-ai" class="text-btn">Copy</button>
          </div>
          <div id="ai-answer-text" class="ai-card-content"></div>
        </div>
      </section>

      <!-- TAB 3: RECENT ARTICLES -->
      <section id="tab-recent" class="tab-pane">
        <div class="search-bar">
          <input type="text" id="search-articles-input" class="form-control" placeholder="Search saved articles...">
        </div>
        <div id="recent-articles-list" class="articles-list">
          <div class="loading-spinner">Loading articles...</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div id="offline-queue-bar" class="offline-bar hidden">
        <span><strong id="offline-count">0</strong> item(s) pending offline sync</span>
        <button id="btn-sync-now" class="btn-sm btn-accent">Sync Now</button>
      </div>
      <div class="footer-links">
        <a href="http://localhost:3000" target="_blank" class="footer-link">Open ReadNow Web App &rarr;</a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
